</div></section>

<section class="card"><div class="title">TEMUAN KONDISI BLOK</div><div class="body" id="findings"></div></section>

$('geoFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('mapStatus').textContent=`Memproses ${f.name} (${Math.round(f.size/1024)} KB)...`;try{const d=JSON.parse(await f.text());if(!d.type)throw Error('bukan GeoJSON');mapData=d;localStorage.setItem(MAP_KEY,JSON.stringify(d));drawMap(false)}catch(err){$('mapStatus').textContent='Gagal impor: '+err.message}e.target.value=''};$('allMap').onclick=()=>drawMap(false);$('selectedMap').onclick=()=>drawMap(true);$('clearMap').onclick=()=>{mapData=null;localStorage.removeItem(MAP_KEY);$('mapSvg').innerHTML='';$('mapStatus').textContent='Peta dihapus.'};$('myPos').onclick=()=>navigator.geolocation.getCurrentPosition(p=>alert(`${p.coords.latitude.toFixed(6)}, ${p.coords.longitude.toFixed(6)}`),()=>alert('GPS gagal'));
function draft(){const fields=['tanggal','pemeriksa','pt','kebun','afdeling','blok','noKanan','noKiri','ancak','ancakStatus','catatan',...types.map(x=>x[0])];const o={};fields.forEach(id=>o[id]=$(id)?.value||'');return {o,side,gps,photos}}function saveDraft(){try{localStorage.setItem(DRAFT_KEY,JSON.stringify(draft()))}catch{}}function restoreDraft(){const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null');if(!d)return;['tanggal','pemeriksa'].forEach(id=>$(id).value=d.o[id]||'');$('pt').value=d.o.pt||'';cascade('pt');$('kebun').value=d.o.kebun||'';cascade('kebun');$('afdeling').value=d.o.afdeling||'';cascade('afdeling');['blok','noKanan','noKiri','ancak','ancakStatus','catatan',...types.map(x=>x[0])].forEach(id=>{if($(id))$(id).value=d.o[id]||''});Object.assign(side,d.side||{});Object.assign(gps,d.gps||{});Object.assign(photos,d.photos||{});['kanan','kiri'].forEach(k=>{if(side[k])document.querySelector(`[data-side=${k}]`).click(),document.querySelector(`[data-side=${k}]`).click()})}
$('form').onsubmit=e=>{e.preventDefault();if(!side.kanan&&!side.kiri)return alert('Pilih pasar kanan atau kiri');if(side.kanan&&!$('noKanan').value||side.kiri&&!$('noKiri').value)return alert('Isi nomor pasar');const r={id:Date.now(),...draft().o,noKanan:side.kanan?$('noKanan').value:'',noKiri:side.kiri?$('noKiri').value:'',findings:Object.fromEntries(types.map(([id])=>[id,{value:$(id).value,gps:gps[id]||null,photo:photos[id]||''}]))};records.unshift(r);localStorage.setItem(DATA_KEY,JSON.stringify(records));localStorage.removeItem(DRAFT_KEY);renderHistory();alert('Pemeriksaan tersimpan offline')};
function renderHistory(){$('history').innerHTML=records.map(r=>`<tr><td>${esc(r.tanggal)}</td><td>${esc(r.pt)}</td><td>${esc(r.kebun)}</td><td>${esc(r.afdeling)}</td><td>${esc(r.blok)}</td><td>${esc(r.noKanan)}</td><td>${esc(r.noKiri)}</td><td>${esc(r.ancakStatus)}</td><td><button class="danger" onclick="del(${r.id})">Hapus</button></td></tr>`).join('')}window.del=id=>{records=records.filter(x=>x.id!==id);localStorage.setItem(DATA_KEY,JSON.stringify(records));renderHistory()};
function download(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}$('exportBtn').onclick=()=>{const h=['Tanggal','Pemeriksa','PT','Kebun','Afdeling','Blok','No Pasar Kanan','No Pasar Kiri','Ancak','Kondisi Ancak',...types.map(x=>x[1])];const rows=records.map(r=>[r.tanggal,r.pemeriksa,r.pt,r.kebun,r.afdeling,r.blok,r.noKanan,r.noKiri,r.ancak,r.ancakStatus,...types.map(([id])=>r.findings[id]?.value||0)]);download('report-cek-blok.csv','\ufeff'+[h,...rows].map(x=>x.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\n'),'text/csv')};$('backupBtn').onclick=()=>download('backup-cek-blok.json',JSON.stringify({master,records,mapData},null,2),'application/json');$('restoreFile').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(d.master){master=d.master;localStorage.setItem(MASTER_KEY,JSON.stringify(master))}if(d.records){records=d.records;localStorage.setItem(DATA_KEY,JSON.stringify(records))}if(d.mapData){mapData=d.mapData;localStorage.setItem(MAP_KEY,JSON.stringify(mapData))}location.reload()}catch{alert('Backup tidak valid')}};
function net(){const online=navigator.onLine;$('net').textContent=online?'ONLINE':'OFFLINE';$('net').classList.toggle('off',!online)}addEventListener('online',net);addEventListener('offline',net);net();$('tanggal').value=new Date().toISOString().slice(0,10);restoreDraft();renderHistory();if(mapData)drawMap(false);document.addEventListener('input',saveDraft);
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
</script></body></html>
